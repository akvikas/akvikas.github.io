<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Vikas AK — computer science engineer and full-stack developer." />
  <title>Vikas AK | Portfolio</title>
  <style>
    :root { --accent: #8ab4f8; --accent-rgb: 138, 180, 248; --bg: #10131d; --text: #f5f7ff; --muted: #c3c7d4; --glass: rgba(20, 25, 39, .58); --border: rgba(255,255,255,.16); --input: rgba(255,255,255,.12); color-scheme: dark; }
    :root.light { --bg: #eaf1ff; --text: #172033; --muted: #536178; --glass: rgba(255,255,255,.62); --border: rgba(19,32,54,.14); --input: rgba(255,255,255,.68); color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100vh; overflow: hidden; color: var(--text); font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); }
    .backdrop { position: fixed; inset: 0; z-index: -2; overflow: hidden; background: radial-gradient(circle at 14% 16%, rgba(var(--accent-rgb), .48), transparent 29%), radial-gradient(circle at 84% 7%, rgba(204, 143, 255, .4), transparent 30%), radial-gradient(circle at 65% 86%, rgba(70, 220, 183, .32), transparent 32%), linear-gradient(135deg, #111827, #273b63 52%, #18233f); }
    .backdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(4, 8, 20, .48), rgba(4, 8, 20, .13)); backdrop-filter: blur(1px); }
    .light .backdrop { background: radial-gradient(circle at 14% 16%, rgba(var(--accent-rgb), .5), transparent 29%), radial-gradient(circle at 84% 7%, rgba(237, 177, 255, .43), transparent 30%), radial-gradient(circle at 65% 86%, rgba(90, 220, 184, .34), transparent 32%), linear-gradient(135deg, #c9dcff, #f0e6ff 52%, #cef6eb); }
    .light .backdrop::after { background: rgba(255,255,255,.15); }
    .page { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 20px 28px 22px; }
    header { display: flex; justify-content: flex-end; align-items: center; gap: 20px; }
    header a { color: var(--text); font-size: .9rem; text-decoration: none; opacity: .86; } header a:hover { color: var(--accent); }
    .avatar { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: #07101f; background: linear-gradient(135deg, #e6efff, var(--accent)); font-weight: 750; box-shadow: 0 5px 20px rgba(0,0,0,.2); }
    main { display: grid; place-items: center; padding-bottom: 44px; }
    .card { width: min(720px, 100%); padding: clamp(28px, 6vw, 52px); text-align: center; border: 1px solid var(--border); border-radius: 28px; background: var(--glass); box-shadow: 0 22px 70px rgba(0,0,0,.2); backdrop-filter: blur(20px) saturate(135%); -webkit-backdrop-filter: blur(20px) saturate(135%); }
    h1 { margin: 0; font-size: clamp(2.5rem, 7vw, 4.8rem); letter-spacing: -.065em; line-height: 1; } h1 span { color: var(--accent); }
    .bio { max-width: 52ch; margin: 18px auto 30px; color: var(--muted); font-size: clamp(.98rem, 2vw, 1.08rem); }
    .shortcuts { display: grid; grid-template-columns: repeat(6, minmax(70px, 1fr)); gap: 17px; max-width: 620px; margin: 36px auto 0; }
    .shortcut { display: grid; justify-items: center; gap: 8px; color: var(--text); font-size: .82rem; text-decoration: none; }.shortcut:hover .icon, .shortcut:focus-visible .icon { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(0,0,0,.18); border-color: var(--accent); }.icon { width: 58px; height: 58px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 18px; background: rgba(255,255,255,.13); font-size: 1.45rem; transition: transform .2s, box-shadow .2s, border-color .2s; }.shortcut small { color: var(--muted); font-size: inherit; }
    .customize { justify-self: end; display: inline-flex; align-items: center; gap: 8px; padding: 9px 13px; border: 1px solid var(--border); border-radius: 999px; color: var(--text); background: rgba(12,16,28,.35); backdrop-filter: blur(10px); cursor: pointer; font: inherit; }.light .customize { background: rgba(255,255,255,.45); }.customize:hover { border-color: var(--accent); }
    .drawer { position: fixed; top: 0; right: 0; z-index: 2; width: min(340px, 89vw); height: 100%; padding: 30px; border-left: 1px solid var(--border); color: var(--text); background: color-mix(in srgb, var(--bg) 85%, transparent); box-shadow: -18px 0 48px rgba(0,0,0,.2); backdrop-filter: blur(24px); transform: translateX(105%); transition: transform .3s ease; }.drawer.open { transform: translateX(0); }.drawer h2 { margin: 0 0 26px; font-size: 1.25rem; }.drawer h3 { margin: 26px 0 12px; color: var(--muted); font-size: .82rem; text-transform: uppercase; letter-spacing: .08em; }.close { position: absolute; top: 22px; right: 20px; width: 35px; height: 35px; border: 0; border-radius: 50%; color: var(--text); background: transparent; cursor: pointer; font-size: 1.35rem; }.close:hover { background: rgba(var(--accent-rgb), .2); }.swatches { display: flex; gap: 12px; }.swatch { width: 42px; height: 42px; border: 3px solid transparent; border-radius: 50%; cursor: pointer; }.swatch[aria-pressed="true"] { border-color: var(--text); box-shadow: 0 0 0 2px var(--accent); }.blue { background: #8ab4f8; }.purple { background: #d0a6ff; }.green { background: #72e1bc; }.theme-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; }.switch { position: relative; width: 50px; height: 28px; border: 0; border-radius: 999px; background: var(--muted); cursor: pointer; }.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: white; transition: transform .2s; }.light .switch::after { transform: translateX(22px); }.hint { color: var(--muted); font-size: .85rem; }
    @media (max-width: 580px) { .page { padding: 17px; }.card { padding: 34px 18px; border-radius: 24px; }.shortcuts { grid-template-columns: repeat(3, 1fr); gap: 18px 12px; }.customize { font-size: 0; gap: 0; padding: 11px; }.customize svg { width: 20px; height: 20px; } }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <div class="page">
    <header aria-label="Site navigation"><a href="#about">About</a><a href="mailto:akvikas14@gmail.com">Contact</a><span class="avatar" aria-label="Vikas AK">VA</span></header>
    <main>
      <section class="card" id="about" aria-labelledby="intro-title">
        <h1 id="intro-title">Hello, I’m <span>Vikas.</span></h1>
        <p class="bio">A computer science engineer building thoughtful full-stack, AI, and real-time web experiences.</p>
        <nav class="shortcuts" aria-label="Portfolio shortcuts">
          <a class="shortcut" href="https://github.com/akvikas" target="_blank" rel="noopener noreferrer"><span class="icon">⌘</span><small>GitHub</small></a>
          <a class="shortcut" href="https://github.com/akvikas/akvikas.github.io" target="_blank" rel="noopener noreferrer"><span class="icon">◈</span><small>Projects</small></a>
          <a class="shortcut" href="/Vikas_AK_Resume.docx" target="_blank" rel="noopener noreferrer"><span class="icon">▤</span><small>Resume</small></a>
          <a class="shortcut" href="https://www.linkedin.com/in/ak-vikas-346446291/" target="_blank" rel="noopener noreferrer"><span class="icon">in</span><small>LinkedIn</small></a>
          <a class="shortcut" href="mailto:akvikas14@gmail.com"><span class="icon">✉</span><small>Email</small></a>
          <a class="shortcut" href="/3d-portfolio.html"><span class="icon">✦</span><small>3D Portfolio</small></a>
        </nav>
      </section>
    </main>
    <button class="customize" id="customize" aria-controls="drawer" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m19.14 12.94.04-.94-.04-.94 2.03-1.58-2-3.46-2.39.96a7 7 0 0 0-1.63-.94L14.8 3.5h-4l-.35 2.54c-.58.24-1.13.55-1.63.94l-2.39-.96-2 3.46 2.03 1.58-.04.94.04.94-2.03 1.58 2 3.46 2.39-.96c.5.39 1.05.7 1.63.94l.35 2.54h4l.35-2.54c.58-.24 1.13-.55 1.63-.94l2.39.96 2-3.46-2.03-1.58ZM12.8 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z"/></svg>Customize</button>
  </div>
  <aside class="drawer" id="drawer" aria-label="Customize portfolio">
    <button class="close" id="close" aria-label="Close customize panel">×</button><h2>Customize</h2>
    <h3>Accent color</h3><div class="swatches"><button class="swatch blue" data-color="#8ab4f8" data-rgb="138,180,248" aria-label="Blue" aria-pressed="true"></button><button class="swatch purple" data-color="#d0a6ff" data-rgb="208,166,255" aria-label="Purple" aria-pressed="false"></button><button class="swatch green" data-color="#72e1bc" data-rgb="114,225,188" aria-label="Green" aria-pressed="false"></button></div>
    <h3>Appearance</h3><div class="theme-row"><span>Light mode</span><button class="switch" id="theme" aria-label="Toggle light mode" aria-pressed="false"></button></div><p class="hint">Your preferences stay on this device.</p>
  </aside>
  <script>
    const root = document.documentElement, drawer = document.querySelector('#drawer'), customize = document.querySelector('#customize');
    const toggleDrawer = (open) => { drawer.classList.toggle('open', open); customize.setAttribute('aria-expanded', String(open)); };
    customize.addEventListener('click', () => toggleDrawer(!drawer.classList.contains('open'))); document.querySelector('#close').addEventListener('click', () => toggleDrawer(false));
    document.querySelectorAll('.swatch').forEach((button) => button.addEventListener('click', () => { root.style.setProperty('--accent', button.dataset.color); root.style.setProperty('--accent-rgb', button.dataset.rgb); document.querySelectorAll('.swatch').forEach((item) => item.setAttribute('aria-pressed', String(item === button))); localStorage.setItem('accent', JSON.stringify([button.dataset.color, button.dataset.rgb])); }));
    document.querySelector('#theme').addEventListener('click', (event) => { const light = root.classList.toggle('light'); event.currentTarget.setAttribute('aria-pressed', String(light)); localStorage.setItem('light', String(light)); });
    const savedAccent = JSON.parse(localStorage.getItem('accent') || 'null'); if (savedAccent) { root.style.setProperty('--accent', savedAccent[0]); root.style.setProperty('--accent-rgb', savedAccent[1]); document.querySelectorAll('.swatch').forEach((item) => item.setAttribute('aria-pressed', String(item.dataset.color === savedAccent[0]))); }
    if (localStorage.getItem('light') === 'true') { root.classList.add('light'); document.querySelector('#theme').setAttribute('aria-pressed', 'true'); }
  </script>
</body>
</html>
